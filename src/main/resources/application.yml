spring:
  application:
    name: k8s-panel
    version: 1.0.0
  session:
    store-type: redis
    timeout: 1800
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 1800

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ficn.panel.controller

oidc:
  issuer: http://localhost:8081/realms/auth-demo
  client-id: k8s-auth
  client-secret: xxx
  scope: openid

cluster:
  cluster-url: http://localhost:6443

# ClickHouse 审计数据源
clickhouse:
  url: http://localhost:8123
  database: falco
  username: default
  password:

# 审计告警实时推送
audit:
  # SSE 增量轮询间隔（毫秒）
  poll-interval-ms: 3000
  report:
    # 仅控制新增告警的自动生成；预览或下载时仍会按需生成 PDF
    enabled: false
    # 报告持久化目录；容器部署时应挂载持久卷
    storage-dir: data/audit-reports
    # 可选：中文 TTF/TTC/OTF 字体绝对路径，留空时探测常见系统字体
    font-path:
    # 报告保留天数；小于等于 0 时关闭自动清理
    retention-days: 7
    # 每天凌晨 02:00 清理过期报告
    cleanup-cron: "0 0 2 * * *"

# Log
logging:
  charset:
    console: UTF-8
    file: UTF-8
